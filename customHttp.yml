customHeaders:
  # Hashed Vite bundles (filenames change every build).
  - pattern: '/assets/index-*.js'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '/assets/index-*.css'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  # Stable public assets (not content-hashed) — moderate browser TTL.
  - pattern: '/assets/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=86400, s-maxage=604800'
  - pattern: '/index.html'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache'
  - pattern: '/'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache'
