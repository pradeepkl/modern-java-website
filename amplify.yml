version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Amplify Hosting CI (if ever Git-connected). Manual zip deploys use
        # scripts/deploy-amplify.sh instead; keep defaults aligned.
        - |
          export VITE_PAPERBACK_SALES_ENABLED="${VITE_PAPERBACK_SALES_ENABLED:-false}"
          export VITE_PAPERBACK_WAITLIST_ENABLED="${VITE_PAPERBACK_WAITLIST_ENABLED:-false}"
          export VITE_DIGITAL_SALES_ENABLED="${VITE_DIGITAL_SALES_ENABLED:-false}"
          echo "VITE_PAPERBACK_SALES_ENABLED=$VITE_PAPERBACK_SALES_ENABLED"
          echo "VITE_PAPERBACK_WAITLIST_ENABLED=$VITE_PAPERBACK_WAITLIST_ENABLED"
          echo "VITE_DIGITAL_SALES_ENABLED=$VITE_DIGITAL_SALES_ENABLED"
          npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
