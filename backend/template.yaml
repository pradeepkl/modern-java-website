AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Modern Java ordering and sample chapter delivery API

Parameters:
  RazorpayKeyId:
    Type: String
    NoEcho: true
  RazorpayKeySecret:
    Type: String
    NoEcho: true
  RazorpayWebhookSecret:
    Type: String
    NoEcho: true
  AdminEmail:
    Type: String
    Default: pradeep@classpath.in
    Description: Primary inbox for order notifications (admin@ aliases here via SES)
  MailFromEmail:
    Type: String
    Default: no-reply@classpath.in
    Description: Send-only From address for transactional mail
  ReplyToEmail:
    Type: String
    Default: pradeep@classpath.in
    Description: Monitored address for customer replies
  SesRegion:
    Type: String
    Default: us-east-1
    Description: SES region where classpath.in is verified
  AllowedOrigin:
    Type: String
    Default: http://localhost:5173
  WebsiteUrl:
    Type: String
    Default: https://modern-java.classpath.in
    Description: Public book website URL included in sample-chapter emails
  SamplePdfKey:
    Type: String
    Default: sample/modern-java-preview.pdf
    Description: S3 object key for the free sample chapter PDF in DigitalAssetsBucket
  DigitalPdfKey:
    Type: String
    Default: digital/modern-java-drm-free_v1.0.pdf
  DigitalEpubKey:
    Type: String
    Default: digital/modern-java-drm-free_v1.0.epub
  DigitalCheckoutBypassSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Optional secret enabling localhost digital checkout without Razorpay
  TurnstileSecretKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Cloudflare Turnstile secret key for sample and digital checkout forms
  ZohoClientId:
    Type: String
    NoEcho: true
    Default: ''
    Description: Zoho Invoice OAuth client ID (India DC)
  ZohoClientSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Zoho Invoice OAuth client secret
  ZohoRefreshToken:
    Type: String
    NoEcho: true
    Default: ''
    Description: Zoho Invoice OAuth refresh token
  ZohoOrganizationId:
    Type: String
    Default: ''
    Description: Zoho Invoice organization ID
  ZohoTaxId:
    Type: String
    Default: ''
    Description: Optional Zoho tax/GST ID applied to invoice line items
  ZohoTaxExemptionId:
    Type: String
    Default: ''
    Description: Zoho tax exemption ID when invoices are non-taxable (no GST)
  ZohoInvoiceTemplateId:
    Type: String
    Default: ''
    Description: Zoho invoice PDF template ID (use a qty/rate template, not day-rate)
  CloudFrontPublicKeySsmParam:
    Type: String
    Default: /modern-java/cloudfront/public-key
    Description: SSM parameter holding the CloudFront URL-signing public key PEM
  CloudFrontPrivateKeySsmParam:
    Type: String
    Default: /modern-java/cloudfront/private-key
    Description: SSM SecureString parameter holding the CloudFront URL-signing private key PEM

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        ORDERS_TABLE: !Ref OrdersTable
        SAMPLE_REQUESTS_TABLE: !Ref SampleRequestsTable
        PAPERBACK_WAITLIST_TABLE: !Ref PaperbackWaitlistTable
        DIGITAL_ASSETS_BUCKET: !Ref DigitalAssetsBucket
        SAMPLE_PDF_KEY: !Ref SamplePdfKey
        DIGITAL_PDF_KEY: !Ref DigitalPdfKey
        DIGITAL_EPUB_KEY: !Ref DigitalEpubKey
        DIGITAL_CHECKOUT_BYPASS_SECRET: !Ref DigitalCheckoutBypassSecret
        TURNSTILE_SECRET_KEY: !Ref TurnstileSecretKey
        RAZORPAY_KEY_ID: !Ref RazorpayKeyId
        RAZORPAY_KEY_SECRET: !Ref RazorpayKeySecret
        RAZORPAY_WEBHOOK_SECRET: !Ref RazorpayWebhookSecret
        ADMIN_EMAIL: !Ref AdminEmail
        MAIL_FROM_EMAIL: !Ref MailFromEmail
        REPLY_TO_EMAIL: !Ref ReplyToEmail
        SES_REGION: !Ref SesRegion
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        WEBSITE_URL: !Ref WebsiteUrl
        ZOHO_CLIENT_ID: !Ref ZohoClientId
        ZOHO_CLIENT_SECRET: !Ref ZohoClientSecret
        ZOHO_REFRESH_TOKEN: !Ref ZohoRefreshToken
        ZOHO_ORGANIZATION_ID: !Ref ZohoOrganizationId
        ZOHO_TAX_ID: !Ref ZohoTaxId
        ZOHO_TAX_EXEMPTION_ID: !Ref ZohoTaxExemptionId
        ZOHO_INVOICE_TEMPLATE_ID: !Ref ZohoInvoiceTemplateId
        CLOUDFRONT_DOMAIN: !GetAtt DigitalAssetsDistribution.DomainName
        CLOUDFRONT_KEY_PAIR_ID: !Ref DigitalAssetsCloudFrontPublicKey
        CLOUDFRONT_PRIVATE_KEY_SSM_PARAM: !Ref CloudFrontPrivateKeySsmParam

Resources:
  OrderApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - https://modern-java.classpath.in
          - http://localhost:5173
        AllowHeaders:
          - content-type
          - x-razorpay-signature
          - x-digital-bypass-secret
        AllowMethods:
          - POST
          - OPTIONS

  OrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/app.handler
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SampleRequestsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PaperbackWaitlistTable
        - S3ReadPolicy:
            BucketName: !Ref DigitalAssetsBucket
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub
                - 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParamName}'
                - ParamName: !Ref CloudFrontPrivateKeySsmParam
      Events:
        CreateOrder:
          Type: HttpApi
          Properties:
            ApiId: !Ref OrderApi
            Path: /orders
            Method: POST
        JoinPaperbackWaitlist:
          Type: HttpApi
          Properties:
            ApiId: !Ref OrderApi
            Path: /paperback-waitlist
            Method: POST
        SubmitContact:
          Type: HttpApi
          Properties:
            ApiId: !Ref OrderApi
            Path: /contact
            Method: POST
        RequestSampleChapter:
          Type: HttpApi
          Properties:
            ApiId: !Ref OrderApi
            Path: /sample-requests
            Method: POST
        RecordMarketingConsent:
          Type: HttpApi
          Properties:
            ApiId: !Ref OrderApi
            Path: /marketing-consents
            Method: POST
        UnsubscribeMarketing:
          Type: HttpApi
          Properties:
            ApiId: !Ref OrderApi
            Path: /marketing-consents/unsubscribe
            Method: POST
        CreateDigitalOrder:
          Type: HttpApi
          Properties:
            ApiId: !Ref OrderApi
            Path: /digital-orders
            Method: POST
        VerifyOrder:
          Type: HttpApi
          Properties:
            ApiId: !Ref OrderApi
            Path: /orders/verify
            Method: POST
        RazorpayWebhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref OrderApi
            Path: /webhooks/razorpay
            Method: POST

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: appOrderId
          AttributeType: S
        - AttributeName: razorpayOrderId
          AttributeType: S
      KeySchema:
        - AttributeName: appOrderId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: RazorpayOrderIndex
          KeySchema:
            - AttributeName: razorpayOrderId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  SampleRequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  PaperbackWaitlistTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StatusCreatedAtIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  DigitalAssetsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  DigitalAssetsCloudFrontPublicKey:
    Type: AWS::CloudFront::PublicKey
    Properties:
      PublicKeyConfig:
        CallerReference: !Sub '${AWS::StackName}-digital-assets-signing-key'
        Name: !Sub '${AWS::StackName}-digital-assets'
        Comment: Signs time-limited PDF/ePub download URLs
        EncodedKey: !Sub
          - '{{resolve:ssm:${ParamName}}}'
          - ParamName: !Ref CloudFrontPublicKeySsmParam

  DigitalAssetsCloudFrontKeyGroup:
    Type: AWS::CloudFront::KeyGroup
    Properties:
      KeyGroupConfig:
        Name: !Sub '${AWS::StackName}-digital-assets'
        Comment: Trusted key group for digital download signed URLs
        Items:
          - !Ref DigitalAssetsCloudFrontPublicKey

  DigitalAssetsOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-digital-assets-oac'
        Description: Allow CloudFront to read private digital assets
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  DigitalAssetsCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-digital-assets'
        Comment: Long-lived cache for versioned PDF/ePub objects (signature query strings excluded)
        DefaultTTL: 31536000
        MaxTTL: 31536000
        MinTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  DigitalAssetsDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName} private digital downloads'
        HttpVersion: http2
        PriceClass: PriceClass_200
        IPV6Enabled: true
        DefaultCacheBehavior:
          TargetOriginId: DigitalAssetsS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: !Ref DigitalAssetsCachePolicy
          TrustedKeyGroups:
            - !Ref DigitalAssetsCloudFrontKeyGroup
        Origins:
          - Id: DigitalAssetsS3Origin
            DomainName: !GetAtt DigitalAssetsBucket.RegionalDomainName
            OriginAccessControlId: !Ref DigitalAssetsOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''

  DigitalAssetsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DigitalAssetsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${DigitalAssetsBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${DigitalAssetsDistribution}'

Outputs:
  OrderApiUrl:
    Description: Set this value as VITE_ORDER_API_URL in the website
    Value: !Sub https://${OrderApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  RazorpayWebhookUrl:
    Description: Configure this endpoint in the Razorpay dashboard
    Value: !Sub https://${OrderApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/webhooks/razorpay
  DigitalAssetsBucketName:
    Description: Upload sample and digital edition files to this private bucket
    Value: !Ref DigitalAssetsBucket
  DigitalAssetsDistributionDomain:
    Description: CloudFront domain used for signed PDF/ePub download links
    Value: !GetAtt DigitalAssetsDistribution.DomainName
  DigitalAssetsDistributionId:
    Description: CloudFront distribution ID for digital assets
    Value: !Ref DigitalAssetsDistribution
  SamplePdfObjectKey:
    Description: Object key for the free sample chapter PDF
    Value: !Ref SamplePdfKey
  DigitalPdfObjectKey:
    Description: Object key for the paid digital PDF
    Value: !Ref DigitalPdfKey
  DigitalEpubObjectKey:
    Description: Object key for the paid digital ePub
    Value: !Ref DigitalEpubKey
